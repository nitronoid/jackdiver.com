<h1 id="images"><a href="#images">Images</a></h1>
<p>An image: <img src="plain.png" alt="plain">. With a width: <img src="inline.png" alt="inline" style="width: 75%">. The same alt text on another image: <img src="other.png" alt="inline">. An empty one: <img src="none.png" alt="">.</p>
<p>A defined image with a width: <img src="path to/defined.png" alt="defined" style="width: 50%">.</p>
<p>Not widths: <img src="a.png 7.5%" alt="a">, <img src="b.png 75 %" alt="b"> and <img src="75%" alt="c">.</p>
